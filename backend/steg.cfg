# nsjail config for steganography tools

name: "steganography-jail"

description: "This policy allows the steganography tools to run inside a jail."
description: ""
description: "Run as:"
description: ""
description: "./nsjail --config /app/embed.cfg -- /app/embed -i input.png -m 'Message to embed' -o output.png "

mode: ONCE
hostname: "STEG-JAIL"
cwd: "/tmp"

clone_newuser: false
clone_newnet: false
clone_newns: false
clone_newpid: false
clone_newipc: false
clone_newuts: false
clone_newcgroup: false

time_limit: 120

envar: "HOME=/tmp"
envar: "TMP=/tmp"
envar: "TMPDIR=/tmp"

rlimit_as: 2048
rlimit_cpu: 1000
rlimit_fsize: 1024
rlimit_nofile: 64

mount {
	src: "/lib"
	dst: "/lib"
	is_bind: true
}

mount {
	src: "/usr/lib"
	dst: "/usr/lib"
	is_bind: true
}

mount {
	src: "/lib64"
	dst: "/lib64"
	is_bind: true
	mandatory: false
}

mount {
	src: "/lib32"
	dst: "/lib32"
	is_bind: true
	mandatory: false
}

mount {
    src :"/tmp"
	dst: "/tmp"
	rw: true
	is_bind: true
}

mount {
	src: "/app"
	dst: "/app"
	is_bind: true
	rw: false
}

seccomp_string: "ALLOW {"
seccomp_string: "  execve, execveat, exit_group,"
seccomp_string: "  rt_sigaction, rt_sigprocmask, sigaltstack,"
seccomp_string: "  clone, gettid, set_tid_address,"
seccomp_string: "  openat, close, read, write, pread64,"
seccomp_string: "  fcntl, mmap, madvise,"
seccomp_string: "  epoll_create1, epoll_ctl, epoll_pwait, eventfd2,"
seccomp_string: "  futex, nanosleep, sched_yield,"
seccomp_string: "  sched_getaffinity, prlimit64"
seccomp_string: "}"
seccomp_string: "DEFAULT KILL_PROCESS"

exec_bin {
	path: ""
	exec_fd: false
}
