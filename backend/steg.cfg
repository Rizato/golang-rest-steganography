# nsjail config for steganography tools

name: "steganography-jail"

description: "This policy allows the steganography tools to run inside a jail."
description: ""
description: "Run as:"
description: ""
description: "./nsjail --config /app/steg.cfg -- /app/embed -i input.png -m 'Message to embed' -o output.png "
description: "or "
description: "./nsjail --config /app/steg.cfg -- /app/extract -i input.png"

mode: ONCE
hostname: "STEG-JAIL"
cwd: "/tmp"

time_limit: 120

envar: "HOME=/tmp"
envar: "TMP=/tmp"
envar: "TMPDIR=/tmp"

rlimit_as: 2048
rlimit_cpu: 1000
rlimit_fsize: 1024
rlimit_nofile: 64

mount {
	src: "/lib"
	dst: "/lib"
	is_bind: true
}

mount {
	src: "/usr/lib"
	dst: "/usr/lib"
	is_bind: true
}

mount {
	src: "/lib64"
	dst: "/lib64"
	is_bind: true
	mandatory: false
}

mount {
	src: "/lib32"
	dst: "/lib32"
	is_bind: true
	mandatory: false
}

mount {
	dst: "/tmp"
	fstype: "tmpfs"
	rw: true
	is_bind: false
}

mount {
	src: "/app"
	dst: "/app"
	is_bind: true
	rw: false
}

seccomp_string: "ALLOW {"
seccomp_string: "  read, write, open, openat, close,"
seccomp_string: "  newfstat, newstat, lseek,"
seccomp_string: "  mmap, mprotect, munmap, brk,"
seccomp_string: "  futex, exit_group,"
seccomp_string: "  arch_prctl, set_tid_address"
seccomp_string: "}"
seccomp_string: "DEFAULT KILL_PROCESS"

exec_bin {
	path: "/app/embed"
	exec_fd: true
}

exec_bin {
	path: "/app/extract"
	exec_fd: true
}
